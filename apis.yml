aid: aclid
name: Aclid
description: Aclid is a biosecurity and biosafety compliance automation platform for the synthetic biology supply
  chain. Gene synthesis providers, biofoundries and research institutions use Aclid to screen DNA/RNA orders for
  pathogenic, toxic and export-controlled sequence elements, to verify the customers placing those orders against
  international sanctions and watchlists, and to run and document the compliance review that regulators and the
  OSTP Framework for Nucleic Acid Synthesis Screening expect. The platform is delivered as a hosted dashboard plus
  a public REST API (api.aclid.bio) that initiates screens from FASTA, FASTQ, CSV or inline sequence payloads, returns
  structured findings with per-framework regulatory reason codes (US Commerce Control List, EU Dual-Use, Australia
  Group and others), manages customers and verifications, and issues hosted or embeddable customer-verification
  flows. Founded 2021 in New York by Kevin Flyangolts with scientific founder Harris H. Wang of Columbia University.
