domain_standard_summary:
  count: 14
  note: >-
    Aclid's contract declares the regulatory frameworks it screens against as first-class,
    machine-readable ids that key the findings map on every screen result — a buyer who already
    speaks US CCL, EU dual-use, Select Agent or the NIH Guidelines can read an Aclid result without
    a bespoke connector. That is the domain-standard signature for this market. It also consumes
    ORCID as a researcher identity and FASTA/FASTQ as input formats, and returns Gene Ontology and
    FunSoC annotations.
compliance_program:
  published: false
  certifications: []
  trust_center: null
  note: >-
    Aclid publishes no SOC 2, ISO 27001, HIPAA, PCI or FedRAMP claim and no trust centre. Probed
    2026-09-06: https://www.aclid.bio/trust -> 404, /security -> 404, /compliance -> 404;
    probe-security-programs.py found no trust surface. NOTE the distinction that matters here:
    Aclid screens its customers against regulatory frameworks; it makes no published claim about
    its OWN security certifications. No `Compliance` pointer is emitted for that reason.
