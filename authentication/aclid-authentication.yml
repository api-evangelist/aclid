note: >-
  DERIVED FROM THE DOCS, NOT FROM securitySchemes. The Aclid OpenAPI 3.1.0 declares NO
  components.securitySchemes and no top-level or per-operation security[] requirement, so
  derive-authentication.py found nothing to aggregate. The auth contract is published as prose in
  the spec's own "Authentication" tag description (rendered at the ReDoc reference above) and is
  captured here verbatim in structure. This is a real contract gap on Aclid's side: a generated
  client or an agent reading only the machine-readable half would send unauthenticated requests
  and get HTTP 403.
