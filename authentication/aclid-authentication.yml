  detail: >-
    "You can use the Aclid API in test mode, which doesn't affect your live data. The API key you
    use to authenticate the request determines whether the request is live mode or test mode."
    Aclid publishes no key prefix convention, so a caller cannot tell live from test by inspecting
    the key.
