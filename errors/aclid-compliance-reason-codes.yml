- id: nih_recombinant_dna_guidelines
  name: NIH Recombinant DNA Guidelines
  description: The US National Institutes of Health (NIH) DNA Guidelines are a biosafety best practice and mandatory
    set of rules that govern safe conduct of research with recombinant DNA at institutions receiving NIH funding.
  reason_codes:
  - code: risk_group_1
    meaning: Any gene from an agent that is not associated with disease in healthy adult humans.
    action: This construct is not associated with disease in healthy adult humans and does not require additional
      considerations or special handling, equipment, or facilities.
  - code: risk_group_2
    meaning: Any gene from an agent that is associated with human disease which is rarely serious and for which
      preventive therapeutic interventions are often available.
    action: This construct is associated with Risk Group 2 and may require special handling, equipment, or facilities.
      Constructs associated with Risk Groups 2-4 should be reviewed according to the NIH Recombinant DNA Guidelines
      to identify precautionary operating procedures or mitigations.
  - code: risk_group_3
    meaning: Any gene from an agent that is associated with serious or lethal human disease for which preventive
      or therapeutic interventions may be available (high individual risk but low community risk).
    action: This construct is associated with Risk Group 3 and may require special handling, equipment, or facilities.
      Constructs associated with Risk Groups 2-4 should be reviewed according to the NIH Recombinant DNA Guidelines
      to identify precautionary operating procedures or mitigations.
  - code: risk_group_4
    meaning: Any gene from an agent that is likely to cause serious or lethal human disease for which preventive
      or therapeutic interventions are not usually available (high individual risk and high community risk).
    action: This construct is associated with Risk Group 4 and may require special handling, equipment, or facilities.
      Constructs associated with Risk Groups 2-4 should be reviewed according to the NIH Recombinant DNA Guidelines
      to identify precautionary operating procedures or mitigations.
- id: eu_directive_2000_54_ec
  name: EU Directive 2000/54/EC
  description: EU Directive 2000/54/EC is legislation that protects workers from risks related to exposure to biological
    agents at work. The directive outlines policies that employers in the EU must implement as part of conducting
    work involving biological hazards including risk assessments, prevention and control, information and training,
    health surveillance of workers, and notifications to authorities.
  reason_codes:
  - code: risk_group_1
    meaning: Any gene from an agent that is unlikely to cause human disease.
    action: This construct is unlikely to cause human disease and does not require additional considerations or
      special handling, equipment, or facilities.
  - code: risk_group_2
    meaning: Any gene from an agent that can cause human disease and might be a hazard to workers; it is unlikely
      to spread to the community; there is usually effective prophylaxis or treatment available.
    action: This construct is associated with Risk Group 2 and may require special handling, equipment, or facilities.
      Constructs associated with Risk Groups 2-4 should be reviewed according to the NIH Recombinant DNA Guidelines
      to identify precautionary operating procedures or mitigations.
  - code: risk_group_3
    meaning: Any gene from an agent that can cause severe human disease and present a serious hazard to workers;
      it may present a risk of spreading to the community, but there is usually effective prophylaxis or treatment
      available.
    action: This construct is associated with Risk Group 3 and may require special handling, equipment, or facilities.
      Constructs associated with Risk Groups 2-4 should be reviewed according to the NIH Recombinant DNA Guidelines
      to identify precautionary operating procedures or mitigations.
  - code: risk_group_4
    meaning: Any gene from an agent that causes severe human disease and is a serious hazard to workers; it may
      present a high risk of spreading to the community; there is usually no effective prophylaxis or treatment
      available.
    action: This construct is associated with Risk Group 4 and may require special handling, equipment, or facilities.
      Constructs associated with Risk Groups 2-4 should be reviewed according to the NIH Recombinant DNA Guidelines
      to identify precautionary operating procedures or mitigations.
- id: zkbs_oncogenes
  name: The Central Committee on Biological Safety (ZKBS) – Oncogenes
  description: The Central Committee on Biological Safety (ZKBS) is an expert panel established by German law for
    evaluating risks of genetically modified organisms to humans, animals, and the environment. This is the commission's
    database for cellular and viral genes / nucleic acids that have been evaluated for oncogenic potential.
  reason_codes:
  - code: oncogene
    meaning: This nucleic acid segment has homology to a known oncogene with neoplastic transforming potential.
    action: Review this nucleic acid segment's homology to oncogenes, mutations of homologous oncogenes, and ability
      to silence homologous oncogenes to identify precautionary operating measures or mitigations.
  - code: shrna_sirna_oncogene
    meaning: This nucleic acid segment has homology to a known oncogene with neoplastic transforming potential when
      silenced.
    action: Review this nucleic acid segment's homology to oncogenes, mutations of homologous oncogenes, and ability
      to silence homologous oncogenes to identify precautionary operating measures or mitigations.
  - code: mutant_oncogene
    meaning: This nucleic acid segment has homology to a known oncogene with neoplastic transforming potential when
      mutated.
    action: Review this nucleic acid segment's homology to oncogenes, mutations of homologous oncogenes, and ability
      to silence homologous oncogenes to identify precautionary operating measures or mitigations.
  - code: activated_mutant_oncogene
    meaning: This nucleic acid segment has homology to a known oncogene with neoplastic transforming potential when
      mutated with increased activity.
    action: Review this nucleic acid segment's homology to oncogenes, mutations of homologous oncogenes, and ability
      to silence homologous oncogenes to identify precautionary operating measures or mitigations.
  - code: deactivated_mutant_oncogene
    meaning: This nucleic acid segment has homology to a known oncogene with neoplastic transforming potential when
      mutated with decreased activity.
    action: Review this nucleic acid segment's homology to oncogenes, mutations of homologous oncogenes, and ability
      to silence homologous oncogenes to identify precautionary operating measures or mitigations.
  - code: exon_9_mutated_oncogene
    meaning: This nucleic acid segment has homology to a known oncogene with neoplastic transforming potential when
      mutated in the exon-9 region.
    action: Review this nucleic acid segment's homology to oncogenes, mutations of homologous oncogenes, and ability
      to silence homologous oncogenes to identify precautionary operating measures or mitigations.
- id: usda_vs
  name: USDA APHIS VS-Regulated Livestock and Poultry Pathogens
  description: The USDA APHIS Veterinary Services (VS) regulates the importation and interstate transport of livestock
    and poultry pathogens. Researchers and importers must apply for Organisms and Vectors (OV) permits to handle
    these biological materials. USDA Veterinary Services provides a Permitting Assistant (VSPA) for determining
    import and transit requirements located here
  reason_codes:
  - code: Regulated pathogen
    meaning: This construct is associated with a Veterinary Services (VS) regulated livestock or poultry pathogen
      and may require filing a VS 16-3 Form for import or interstate transport.
    action: Review constructs associated with Veterinary Services (VS) regulated livestock or poultry pathogens
      and use the VS Permitting Assistant (VSPA) to determine requirements for transport.
  - code: Potentially regulated
    meaning: This construct is associated with a genus of Veterinary Services (VS) regulated livestock or poultry
      pathogens. The genus may contain both pathogenic and nonpathogenic species and may require filing a VS 16-3
      Form for import or interstate transport.
    action: Review constructs associated with Veterinary Services (VS) regulated livestock or poultry pathogens
      and use the VS Permitting Assistant (VSPA) to determine requirements for transport.
  - code: Regulated arthropod vector
    meaning: This construct is associated with a Veterinary Services (VS) regulated livestock or poultry arthropod
      vector and may require filing a VS 16-3 Form for import or interstate transport.
    action: Review constructs associated with Veterinary Services (VS) regulated livestock or poultry arthropod
      vectors and use the VS Permitting Assistant (VSPA) to determine requirements for transport.
  - code: Select agent
    meaning: This construct may be regulated by the US Federal Select Agent Program (FSAP). If the construct doesn't
      meet requirements for registration with US FSAP, filing a Veterinary Services (VS) 16-3 Form may be required
      for import or interstate transport.
    action: Review constructs associated with the US Federal Select Agent Program (FSAP) first to determine authority
      for transport. If this construct does not meet requirements for registration with US FSAP, use the VS Permitting
      Assistant (VSPA) to determine requirements for transport.
